services:
  - type: web
    name: gridwatch-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridwatch-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: HEARTBEAT_SIM_ENABLED
        value: "true"

databases:
  - name: gridwatch-db
    plan: free
